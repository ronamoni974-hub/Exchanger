<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchanger | USDT to BDT</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { margin: 0 0 5px 0; color: var(--primary); }
        .header p { margin: 0; color: var(--text-muted); font-size: 14px; }
        .rate-box { background: #e0e7ff; color: #4338ca; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; outline: none; transition: border 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        .amount-container { display: flex; gap: 10px; }
        .wallet-box { background: #fef2f2; border: 1px dashed #ef4444; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #991b1b; text-align: center; }
        .wallet-box span { display: block; font-weight: bold; font-size: 15px; margin-top: 5px; word-break: break-all; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #4f46e5; }
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: var(--text-muted); }
        #loading { display: none; text-align: center; margin-top: 10px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🔄 Fast Exchanger</h2>
        <p>Exchange your USDT to BDT instantly</p>
    </div>

    <div class="rate-box">
        Today's Rate: 1 USDT = <span id="currentRate">118</span> BDT
    </div>

    <form id="exchangeForm">
        <div class="amount-container">
            <div class="form-group" style="flex: 1;">
                <label>Send (USDT)</label>
                <input type="number" id="usdtAmount" min="5" placeholder="Min: 5" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Get (BDT)</label>
                <input type="number" id="bdtAmount" readonly style="background: #f3f4f6;">
            </div>
        </div>

        <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod" required>
                <option value="bKash">bKash (Personal)</option>
                <option value="Nagad">Nagad (Personal)</option>
                <option value="Rocket">Rocket (Personal)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Account Number</label>
            <input type="text" id="accountNumber" placeholder="e.g., 017XXXXXXXX" required>
        </div>

        <div class="wallet-box">
            Send your USDT (TRC20) to this address:
            <span>TRC20: TYourAdminWalletAddressHere...</span>
        </div>

        <div class="form-group">
            <label>Transaction ID (TrxID) / Binance Pay ID</label>
            <input type="text" id="trxId" placeholder="Enter TrxID after sending" required>
        </div>

        <button type="submit" id="submitBtn">Submit Request</button>
        <div id="loading">Processing... Please wait.</div>
    </form>

    <div class="footer">
        Secured & Powered by Your Brand
    </div>
</div>

<script>
    // --- কনফিগারেশন সেটআপ ---
    const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; // BotFather থেকে পাওয়া টোকেন দিন
    const CHAT_ID = 'YOUR_CHAT_ID_HERE';     // আপনার টেলিগ্রাম আইডি দিন
    const USDT_RATE = 118;

    document.getElementById('currentRate').innerText = USDT_RATE;

    // রিয়েল-টাইম অ্যামাউন্ট ক্যালকুলেশন
    document.getElementById('usdtAmount').addEventListener('input', function() {
        const usdt = parseFloat(this.value);
        if(usdt && usdt >= 0) {
            document.getElementById('bdtAmount').value = (usdt * USDT_RATE).toFixed(2);
        } else {
            document.getElementById('bdtAmount').value = '';
        }
    });

    // ফর্ম সাবমিশন হ্যান্ডলিং
    document.getElementById('exchangeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const usdt = document.getElementById('usdtAmount').value;
        const bdt = document.getElementById('bdtAmount').value;
        const method = document.getElementById('paymentMethod').value;
        const account = document.getElementById('accountNumber').value;
        const trxId = document.getElementById('trxId').value;

        if (usdt < 5) {
            alert("Minimum exchange amount is 5 USDT.");
            return;
        }

        // বাটন লোডিং স্টেট
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        // টেলিগ্রামের জন্য মেসেজ তৈরি
        const message = `🔔 *New Web Exchange Request!*\n\n💵 *USDT:* ${usdt}\n৳ *BDT:* ${bdt}\n🏦 *Method:* ${method}\n📱 *Account:* \`${account}\`\n🔑 *TrxID:* \`${trxId}\``;

        // টেলিগ্রাম API এ রিকোয়েস্ট পাঠানো
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.ok) {
                alert("✅ Request submitted successfully! We will send the money soon.");
                document.getElementById('exchangeForm').reset();
            } else {
                alert("❌ Failed to send request. Please try again.");
            }
        })
        .catch(error => {
            alert("❌ An error occurred. Please check your internet connection.");
        })
        .finally(() => {
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        });
    });
</script>

</body>
</html>
