<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Exchanger Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Live Animated Background Orbs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.6;
            animation: float 8s infinite alternate ease-in-out;
        }
        .blob-1 { top: 10%; left: -10%; width: 250px; height: 250px; background: #4facfe; }
        .blob-2 { bottom: 10%; right: -10%; width: 300px; height: 300px; background: #667eea; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* User Profile Section */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .user-info h3 { font-size: 16px; margin: 0; }
        .user-info p { font-size: 12px; color: #cbd5e1; margin: 0; display: flex; align-items: center; gap: 5px; }
        .badge { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 2px 8px; border-radius: 10px; font-size: 10px; border: 1px solid #34d399; }

        .rate-box { background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); color: var(--primary); padding: 10px; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 20px; font-size: 14px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #e2e8f0; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }
        .form-group select option { background: var(--bg-dark); color: #fff; }
        
        .amount-container { display: flex; gap: 10px; }

        .wallet-box { background: rgba(239, 68, 68, 0.1); border: 1px dashed #ef4444; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 12px; color: #fca5a5; text-align: center; }
        .wallet-box span { display: block; font-weight: 600; font-size: 14px; margin-top: 5px; color: #fff; word-break: break-all; }

        button {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }

        #loading { display: none; text-align: center; margin-top: 10px; color: var(--primary); font-size: 13px; }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="glass-container">
    <div class="user-profile">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
            <h3 id="userName">Loading User...</h3>
            <p>ID: <span id="userId">-------</span> <span class="badge">✅ Verified</span></p>
        </div>
    </div>

    <div class="rate-box">
        🚀 Today's Rate: 1 USDT = <span id="currentRate">118</span> BDT
    </div>

    <form id="exchangeForm">
        <div class="amount-container">
            <div class="form-group" style="flex: 1;">
                <label>Send (USDT)</label>
                <input type="number" id="usdtAmount" min="5" placeholder="Min: 5" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Get (BDT)</label>
                <input type="number" id="bdtAmount" readonly>
            </div>
        </div>

        <div class="form-group">
            <label>Receive Payment In</label>
            <select id="paymentMethod" required>
                <option value="bKash">bKash (Personal)</option>
                <option value="Nagad">Nagad (Personal)</option>
                <option value="Rocket">Rocket (Personal)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Account Number</label>
            <input type="number" id="accountNumber" placeholder="e.g., 017XXXXXXXX" required>
        </div>

        <div class="wallet-box">
            Send TRC20 USDT to this address:
            <span>TRC20: TYourAdminWalletAddressHere...</span>
        </div>

        <div class="form-group">
            <label>Transaction ID (TrxID)</label>
            <input type="text" id="trxId" placeholder="Enter TrxID after sending" required>
        </div>

        <button type="submit" id="submitBtn">Confirm Exchange</button>
        <div id="loading">Verifying & Sending Request...</div>
    </form>
</div>

<script>
    // --- টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজেশন ---
    const tg = window.Telegram.WebApp;
    tg.expand(); // অ্যাপটিকে ফুল-স্ক্রিন করবে
    
    // কনফিগারেশন
    const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; 
    const ADMIN_CHAT_ID = 'YOUR_CHAT_ID_HERE'; 
    const USDT_RATE = 118;

    // ইউজার ডেটা ফেচ করা (অটো লগইন)
    let tgUser = tg.initDataUnsafe?.user;
    
    if (tgUser) {
        // টেলিগ্রাম থেকে ইউজারের নাম ও আইডি বসানো
        const firstName = tgUser.first_name || "User";
        document.getElementById('userName').innerText = firstName;
        document.getElementById('userId').innerText = tgUser.id;
        document.getElementById('userAvatar').innerText = firstName.charAt(0).toUpperCase();
    } else {
        // যদি ব্রাউজার থেকে ওপেন করে (টেলিগ্রাম ছাড়া)
        document.getElementById('userName').innerText = "Web User";
        document.querySelector('.badge').innerText = "⚠️ Not Telegram";
        document.querySelector('.badge').style.borderColor = "#f59e0b";
        document.querySelector('.badge').style.color = "#f59e0b";
        document.querySelector('.badge').style.background = "rgba(245, 158, 11, 0.2)";
    }

    // রিয়েল-টাইম ক্যালকুলেশন
    document.getElementById('usdtAmount').addEventListener('input', function() {
        const usdt = parseFloat(this.value);
        if(usdt && usdt >= 5) {
            document.getElementById('bdtAmount').value = (usdt * USDT_RATE).toFixed(2);
        } else {
            document.getElementById('bdtAmount').value = '';
        }
    });

    // ফর্ম সাবমিট
    document.getElementById('exchangeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const usdt = document.getElementById('usdtAmount').value;
        const bdt = document.getElementById('bdtAmount').value;
        const method = document.getElementById('paymentMethod').value;
        const account = document.getElementById('accountNumber').value;
        const trxId = document.getElementById('trxId').value;
        const finalUserId = tgUser ? tgUser.id : "Web";
        const finalUserName = tgUser ? tgUser.first_name : "Web User";

        if (usdt < 5) {
            tg.showAlert("Minimum exchange amount is 5 USDT.");
            return;
        }

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        // টেলিগ্রাম বটের মাধ্যমে অ্যাডমিনকে মেসেজ
        const message = `🔔 *New Mini App Request!*\n\n👤 *User:* ${finalUserName}\n🆔 *Telegram ID:* \`${finalUserId}\`\n\n💵 *USDT:* ${usdt}\n৳ *BDT:* ${bdt}\n🏦 *Method:* ${method}\n📱 *Account:* \`${account}\`\n🔑 *TrxID:* \`${trxId}\``;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: ADMIN_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.ok) {
                // টেলিগ্রামের নেটিভ পপআপ নোটিফিকেশন
                tg.showAlert("✅ Request submitted! Admin will process it soon.");
                document.getElementById('exchangeForm').reset();
                tg.close(); // রিকোয়েস্ট শেষে মিনি অ্যাপ অটো ক্লোজ হয়ে যাবে
            } else {
                tg.showAlert("❌ Failed to send request.");
            }
        })
        .catch(error => {
            tg.showAlert("❌ Connection error!");
        })
        .finally(() => {
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        });
    });
</script>

</body>
</html>
