<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Exchanger Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            height: 100vh;
            overflow: hidden; /* Prevent body scroll */
            position: relative;
        }

        /* Live Animated Background Orbs */
        .blob {
            position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1; opacity: 0.6; animation: float 8s infinite alternate ease-in-out;
        }
        .blob-1 { top: 10%; left: -10%; width: 250px; height: 250px; background: #4facfe; }
        .blob-2 { bottom: 20%; right: -10%; width: 300px; height: 300px; background: #667eea; animation-delay: -4s; }

        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-30px) scale(1.1); } }

        /* Main App Container */
        .app-container {
            height: calc(100vh - 70px); /* Leave space for bottom nav */
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 30px;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Tabs */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Profile Section */
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar {
            width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #fff;
        }
        .user-info h3 { font-size: 18px; margin: 0; }
        .user-info p { font-size: 12px; color: #cbd5e1; margin: 0; }

        /* Trust Score */
        .trust-section { background: rgba(0, 0, 0, 0.2); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); margin-bottom: 20px; }
        .trust-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; font-weight: 600; }
        .trust-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden; }
        .trust-bar-fill { height: 100%; background: #10b981; border-radius: 5px; width: 100%; transition: width 0.5s; }
        .trust-note { font-size: 11px; color: #94a3b8; margin-top: 8px; text-align: center; }

        /* History List */
        .history-item { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 12px; 
            border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .hist-details h4 { font-size: 14px; margin: 0; color: var(--primary); }
        .hist-details p { font-size: 11px; color: #94a3b8; margin: 5px 0 0 0; }
        .hist-status { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        /* Form Elements */
        .rate-box { background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); color: var(--primary); padding: 10px; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 20px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #e2e8f0; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }
        .form-group select option { background: var(--bg-dark); color: #fff; }
        .amount-container { display: flex; gap: 10px; }
        .wallet-box { background: rgba(239, 68, 68, 0.1); border: 1px dashed #ef4444; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 12px; color: #fca5a5; text-align: center; }
        
        button {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s;
        }
        button:active { transform: scale(0.98); }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            color: #94a3b8; text-align: center; font-size: 12px; cursor: pointer; padding: 10px; width: 50%; transition: 0.3s;
        }
        .nav-item i { display: block; font-size: 20px; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="app-container">
    
    <div id="exchangeTab" class="tab-content active">
        <div class="glass-card">
            <div class="rate-box">🚀 Today's Rate: 1 USDT = <span id="currentRate">118</span> BDT</div>
            <form id="exchangeForm">
                <div class="amount-container">
                    <div class="form-group" style="flex: 1;">
                        <label>Send (USDT)</label>
                        <input type="number" id="usdtAmount" min="5" placeholder="Min: 5" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Get (BDT)</label>
                        <input type="number" id="bdtAmount" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label>Receive Payment In</label>
                    <select id="paymentMethod" required>
                        <option value="bKash">bKash (Personal)</option>
                        <option value="Nagad">Nagad (Personal)</option>
                        <option value="Rocket">Rocket (Personal)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Your Account Number</label>
                    <input type="number" id="accountNumber" placeholder="e.g., 017XXXXXXXX" required>
                </div>

                <div class="wallet-box">
                    Send TRC20 USDT to this address:<br>
                    <span style="font-weight: 600; font-size:14px; color:#fff;">TRC20: TYourWalletAddressHere...</span>
                </div>

                <div class="form-group">
                    <label>Transaction ID (TrxID)</label>
                    <input type="text" id="trxId" placeholder="Enter TrxID after sending" required>
                </div>

                <button type="submit" id="submitBtn">Confirm Exchange</button>
            </form>
        </div>
    </div>

    <div id="profileTab" class="tab-content">
        <div class="glass-card">
            <div class="profile-header">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <h3 id="userName">Loading...</h3>
                    <p>ID: <span id="userId">-------</span></p>
                </div>
            </div>

            <div class="trust-section">
                <div class="trust-header">
                    <span>Trust Level</span>
                    <span id="trustScoreText" style="color: #10b981;">100% (Excellent)</span>
                </div>
                <div class="trust-bar-bg">
                    <div class="trust-bar-fill" id="trustBar"></div>
                </div>
                <div class="trust-note">⚠️ স্ক্যাম বা ভুয়া রিকোয়েস্ট দিলে ট্রাস্ট লেভেল কমে যাবে এবং অ্যাকাউন্ট ব্যান হতে পারে।</div>
            </div>

            <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--primary);">Transaction History</h3>
            <div id="historyContainer">
                </div>
        </div>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('exchangeTab', this)">
        <i class="fa-solid fa-right-left"></i>
        Exchange
    </div>
    <div class="nav-item" onclick="switchTab('profileTab', this)">
        <i class="fa-solid fa-user-shield"></i>
        Profile
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // --- Configuration ---
    const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; 
    const ADMIN_CHAT_ID = 'YOUR_CHAT_ID_HERE'; 
    const USDT_RATE = 118;
    
    // --- User Data Setup ---
    let tgUser = tg.initDataUnsafe?.user;
    let finalUserId = tgUser ? tgUser.id : "Web_Test";
    let firstName = tgUser ? tgUser.first_name : "Web User";

    document.getElementById('userName').innerText = firstName;
    document.getElementById('userId').innerText = finalUserId;
    document.getElementById('userAvatar').innerText = firstName.charAt(0).toUpperCase();

    // --- Tab Switching Logic ---
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
        
        if(tabId === 'profileTab') { loadHistory(); }
    }

    // --- Exchange Logic ---
    document.getElementById('usdtAmount').addEventListener('input', function() {
        const usdt = parseFloat(this.value);
        if(usdt && usdt >= 5) { document.getElementById('bdtAmount').value = (usdt * USDT_RATE).toFixed(2); } 
        else { document.getElementById('bdtAmount').value = ''; }
    });

    document.getElementById('exchangeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const usdt = document.getElementById('usdtAmount').value;
        const bdt = document.getElementById('bdtAmount').value;
        const method = document.getElementById('paymentMethod').value;
        const account = document.getElementById('accountNumber').value;
        const trxId = document.getElementById('trxId').value;

        if (usdt < 5) { tg.showAlert("Minimum 5 USDT"); return; }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing..."; btn.disabled = true;

        const message = `🔔 *Exchange Request!*\n\n👤 *User:* ${firstName}\n🆔 *ID:* \`${finalUserId}\`\n💵 *USDT:* ${usdt}\n৳ *BDT:* ${bdt}\n🏦 *Method:* ${method}\n📱 *Ac:* \`${account}\`\n🔑 *TrxID:* \`${trxId}\``;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'Markdown' })
        })
        .then(res => res.json())
        .then(data => {
            if(data.ok) {
                saveTransaction({ date: new Date().toLocaleDateString(), usdt: usdt, bdt: bdt, method: method, status: "Pending" });
                tg.showAlert("✅ Request submitted!");
                document.getElementById('exchangeForm').reset();
                document.getElementById('bdtAmount').value = '';
            } else { tg.showAlert("❌ Error sending request."); }
        })
        .catch(() => tg.showAlert("❌ Connection error!"))
        .finally(() => { btn.innerText = "Confirm Exchange"; btn.disabled = false; });
    });

    // --- History & Trust Level Logic (LocalStorage Demo) ---
    // Note: In real app, fetch this from Firebase based on User ID
    function saveTransaction(txn) {
        let history = JSON.parse(localStorage.getItem(`txn_${finalUserId}`)) || [];
        history.unshift(txn); // Add new txn to start
        localStorage.setItem(`txn_${finalUserId}`, JSON.stringify(history));
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem(`txn_${finalUserId}`)) || [];
        let container = document.getElementById('historyContainer');
        container.innerHTML = '';

        if(history.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size: 13px;">No transactions found.</p>';
            return;
        }

        history.forEach(txn => {
            container.innerHTML += `
                <div class="history-item">
                    <div class="hist-details">
                        <h4>${txn.usdt} USDT ➔ ${txn.bdt} BDT</h4>
                        <p><i class="fa-regular fa-clock"></i> ${txn.date} | ${txn.method}</p>
                    </div>
                    <div class="hist-status">${txn.status} ⏳</div>
                </div>
            `;
        });
    }

    // Demo: Admin can change this Trust Level in database. Here it's fixed to 100% for demo.
    let userTrustScore = 100; // You can fetch this from Firebase
    let barColor = userTrustScore > 80 ? "#10b981" : userTrustScore > 50 ? "#f59e0b" : "#ef4444";
    let statusText = userTrustScore > 80 ? "Excellent" : userTrustScore > 50 ? "Warning" : "Danger";
    
    document.getElementById('trustBar').style.width = userTrustScore + '%';
    document.getElementById('trustBar').style.background = barColor;
    document.getElementById('trustScoreText').innerText = `${userTrustScore}% (${statusText})`;
    document.getElementById('trustScoreText').style.color = barColor;

</script>
</body>
</html>
